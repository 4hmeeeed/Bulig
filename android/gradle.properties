org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# Every androidx.* dependency in this project expects the AndroidX package
# names, not the old android.support.* ones. AGP checks this explicitly and
# refuses to build without it once any androidx dependency is present.
android.useAndroidX=true
